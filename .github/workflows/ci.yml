name: CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

# A new push to the same branch cancels in-flight runs so we don't
# burn minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Scan bad patterns
        # Grep for always-bad patterns that are cheap to detect but
        # awkward to express as ESLint rules (deep-clone via JSON,
        # stray console.log, eval/new Function).
        run: bash scripts/scan-bad-patterns.sh

      - name: Dead-code (knip)
        # Fails on unused exports, files, or devDependencies — keeps
        # the codebase pruned as features come and go.
        run: npm run knip

      - name: Typecheck
        run: npm run typecheck

      - name: Tests + coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Static-build smoke
        # Verifies the built dist/ ships index.html + app.html with the
        # GitHub Pages base path. Must run after build because the
        # smoke test reads dist/ directly.
        run: npm run test:smoke

      - name: Bundle-size gate
        # size-limit reads thresholds from package.json. Failing here
        # blocks the PR before merge so chunks can't drift past the cap.
        run: npm run size

      - name: Production dependency audit
        # Production-only audit gate; dev-only advisories (e.g. VitePress)
        # are tracked separately in docs/SECURITY-NOTES.md.
        run: npm audit --audit-level=high --omit=dev

      - name: Generated docs match their generator
        # docs/examples/*.json is generated and committed. It drifted a
        # month behind its source once because only deploy ran the
        # generator, and it discarded the result.
        run: npm run docs:verify

  e2e:
    name: Playwright + axe-core (Chromium / Firefox / WebKit / mobile)
    runs-on: ubuntu-latest
    # 644 specs across four engines on a two-core runner. A green run is
    # around 50 minutes; this is a hang catcher, not a budget. maxFailures
    # is what keeps a failing run short.
    timeout-minutes: 70
    needs: check
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The browser bundles are ~500MB and change only when Playwright
      # does. The system libraries they link against are not cacheable,
      # so those are installed either way.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Build
        run: npm run build

      - name: E2E (full browser matrix + axe-core)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse-CI (a11y + SEO gates; perf advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build (root-base) + Lighthouse audits
        # `test:lhci` rebuilds with VITE_BASE=/ so the LHCI static
        # server can serve dist/app.html at /app.html. Restores nothing
        # — CI artifacts are ephemeral.
        run: npm run test:lhci
