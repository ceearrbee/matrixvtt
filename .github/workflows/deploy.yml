name: Deploy to GitHub Pages

# Deploys only after the CI workflow (check + e2e + lighthouse) succeeds
# on master/main; manual dispatch skips the wait.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - master
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Probe the Pages API once so build + deploy can skip cleanly on forks
  # / private repos where Pages is disabled. Without this, deploy-pages
  # fails with a 404 and the whole workflow goes red even though the
  # build succeeded.
  preflight:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check if GitHub Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          http_status=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/pages" \
            --silent -i 2>/dev/null | head -n1 | awk '{print $2}')
          if [ "$http_status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✓ Pages is enabled — will deploy."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ Pages is not enabled for this repo (status: ${http_status:-unknown}). Skipping deploy."
          fi

  build:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Deploy the exact commit CI validated, not whatever master
          # points at by the time this workflow starts.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test -- --run

      - name: Production dependency audit
        run: npm audit --audit-level=high --omit=dev

      - name: Build with Vite
        run: npm run build

      - name: Static-build smoke
        run: npm run test:smoke

      - name: Bundle-size gate
        run: npm run size

      # VitePress emits into dist/docs, which the Pages artifact picks
      # up. The app's sidebar links to <base>docs/, so without this
      # step that link 404s on the deployed site.
      - name: Build docs site
        run: npm run docs:build

      - name: Upload artifact
        if: needs.preflight.outputs.pages_enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: needs.preflight.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [preflight, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Post-deploy verification: fetch health.json from the live URL,
      # confirm the deploy serves status:ok and that the version stamp
      # matches the package.json we just built from. Catches the class
      # of "deploy succeeded but the CDN is serving a previous build"
      # bugs that are otherwise invisible until a user reports them.
      - name: Post-deploy health check
        run: |
          set -euo pipefail
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          # The Pages action returns the base URL (with trailing slash).
          HEALTH_URL="${PAGE_URL%/}/health.json"
          echo "Fetching $HEALTH_URL"
          # Pages takes a few seconds to start serving fresh content
          # after the deploy action returns. Retry for up to ~60s.
          for i in 1 2 3 4 5 6; do
            if HEALTH_JSON=$(curl --fail --silent --show-error --max-time 10 "$HEALTH_URL"); then
              break
            fi
            echo "attempt $i failed; sleeping 10s"
            sleep 10
          done
          echo "$HEALTH_JSON"
          STATUS=$(echo "$HEALTH_JSON" | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{console.log(JSON.parse(s).status)})')
          VERSION=$(echo "$HEALTH_JSON" | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{console.log(JSON.parse(s).version)})')
          PKG_VERSION=$(node -e 'console.log(require("./package.json").version)')
          test "$STATUS" = "ok" || { echo "health.status was '$STATUS', expected 'ok'"; exit 1; }
          test "$VERSION" = "$PKG_VERSION" || { echo "deployed version '$VERSION' != built version '$PKG_VERSION'"; exit 1; }
          echo "✓ Deploy verified — version $VERSION live at $PAGE_URL"
